[workspace]
members = ["did_registry"]

[package]
name = "mozartpay-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mozartpay_contracts"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
soroban-sdk = { version = "23.5" }
# NOTE: did-registry is NOT a [dependencies] entry — linking its rlib into the
# wasm cdylib would collide on exported contract fns (pause/unpause/...). The
# OA contract calls it via a hand-rolled try_invoke_contract client. It IS a
# dev-dependency so tests can register the real contract natively.

[dev-dependencies]
soroban-sdk = { version = "23.5", features = ["testutils"] }
did-registry = { path = "did_registry" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
