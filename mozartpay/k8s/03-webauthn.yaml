apiVersion: apps/v1
kind: Deployment
metadata:
  name: webauthn
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: webauthn
    app.kubernetes.io/part-of: webauthn
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mozartpay
      app.kubernetes.io/component: webauthn
      app.kubernetes.io/part-of: webauthn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mozartpay
        app.kubernetes.io/component: webauthn
        app.kubernetes.io/part-of: webauthn
    spec:
      serviceAccountName: mozartpay-sa
      containers:
      - name: webauthn
        image: mozartpay/webauthn:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: LOG_LEVEL
          value: "info"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mozartpay-secrets
              key: postgres-url
        volumeMounts:
        - name: config
          mountPath: /app/config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: mozartpay-config
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: webauthn
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: webauthn
    app.kubernetes.io/part-of: webauthn
spec:
  selector:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: webauthn
    app.kubernetes.io/part-of: webauthn
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webauthn-hpa
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: webauthn
    app.kubernetes.io/part-of: webauthn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webauthn
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
