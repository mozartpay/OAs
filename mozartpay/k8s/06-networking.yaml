apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mozartpay-network-policy
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mozartpay
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 11434
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mozartpay
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 11434
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mozartpay-ingress
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - mozartpay.example.com
    - api.mozartpay.example.com
    secretName: mozartpay-tls
  rules:
  - host: mozartpay.example.com
    http:
      paths:
      - path: /webauthn(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: webauthn
            port:
              number: 8000
      - path: /mcp(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: mcp-sse
            port:
              number: 3000
      - path: /horizon-testnet(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: horizon-testnet
            port:
              number: 8000
      - path: /ollama(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: ollama
            port:
              number: 11434
  - host: api.mozartpay.example.com
    http:
      paths:
      - path: /webauthn
        pathType: Prefix
        backend:
          service:
            name: webauthn
            port:
              number: 8000
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: mcp-sse
            port:
              number: 3000
      - path: /horizon-testnet
        pathType: Prefix
        backend:
          service:
            name: horizon-testnet
            port:
              number: 8000
      - path: /ollama
        pathType: Prefix
        backend:
          service:
            name: ollama
            port:
              number: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: mozartpay-external
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: external-service
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: mozartpay
  ports:
  - name: webauthn
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: mcp
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: horizon
    port: 8001
    targetPort: 8000
    protocol: TCP
  - name: ollama
    port: 11434
    targetPort: 11434
    protocol: TCP
