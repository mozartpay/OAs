apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sse
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: mcp
    app.kubernetes.io/transport: sse
    app.kubernetes.io/part-of: mcp
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mozartpay
      app.kubernetes.io/component: mcp
      app.kubernetes.io/transport: sse
      app.kubernetes.io/part-of: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mozartpay
        app.kubernetes.io/component: mcp
        app.kubernetes.io/transport: sse
        app.kubernetes.io/part-of: mcp
    spec:
      serviceAccountName: mozartpay-sa
      containers:
      - name: mcp
        image: mozartpay/mcp:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: TRANSPORT
          value: "sse"
        - name: PORT
          value: "3000"
        - name: LOG_LEVEL
          value: "info"
        - name: NETWORK
          value: "stellar-testnet"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mozartpay-secrets
              key: postgres-url
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: state
          mountPath: /root/.mozartpay
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: mozartpay-config
      - name: state
        emptyDir: {}
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-sse
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: mcp
    app.kubernetes.io/transport: sse
    app.kubernetes.io/part-of: mcp
spec:
  selector:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: mcp
    app.kubernetes.io/transport: sse
    app.kubernetes.io/part-of: mcp
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-sse-hpa
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: mcp
    app.kubernetes.io/transport: sse
    app.kubernetes.io/part-of: mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-sse
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-stdio-example
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: mcp
    app.kubernetes.io/transport: stdio
    app.kubernetes.io/part-of: mcp
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mozartpay
        app.kubernetes.io/component: mcp
        app.kubernetes.io/transport: stdio
        app.kubernetes.io/part-of: mcp
    spec:
      serviceAccountName: mozartpay-sa
      restartPolicy: Never
      containers:
      - name: mcp
        image: mozartpay/mcp:latest
        env:
        - name: TRANSPORT
          value: "stdio"
        - name: LOG_LEVEL
          value: "info"
        - name: NETWORK
          value: "stellar-testnet"
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: state
          mountPath: /root/.mozartpay
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: mozartpay-config
      - name: state
        emptyDir: {}
      securityContext:
        fsGroup: 1000
