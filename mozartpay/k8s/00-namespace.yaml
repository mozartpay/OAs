apiVersion: v1
kind: Namespace
metadata:
  name: mozartpay
  labels:
    name: mozartpay
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: infrastructure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mozartpay-config
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: config
data:
  config.json: |
    {
      "network": "stellar-testnet",
      "walletType": "wwwallet",
      "didMethod": "key",
      "integrations": {
        "stellarCarbonEnabled": true,
        "x402Enabled": true,
        "tempoEnabled": true,
        "stellarHorizonUrl": "http://horizon-testnet:8000"
      },
      "debug": false
    }
  logging.yaml: |
    level: info
    format: json
    output: stdout
    fields:
      service: mozartpay
      version: "0.1.0-mvp"
---
apiVersion: v1
kind: Secret
metadata:
  name: mozartpay-secrets
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Base64 encoded values - replace with actual secrets
  postgres-password: bW96YXJ0cGF5MTIz  # mozartpay123
  postgres-user: bW96YXJ0cGF5        # mozartpay
  bitpanda-api-key: ""  # Add if needed
  bitpanda-api-secret: ""  # Add if needed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mozartpay-sa
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mozartpay-role
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mozartpay-rolebinding
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: mozartpay-sa
  namespace: mozartpay
roleRef:
  kind: Role
  name: mozartpay-role
  apiGroup: rbac.authorization.k8s.io
