apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: horizon-testnet-pvc
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: horizon
    app.kubernetes.io/network: testnet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: horizon-mainnet-pvc
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: horizon
    app.kubernetes.io/network: mainnet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-testnet
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: horizon
    app.kubernetes.io/network: testnet
    app.kubernetes.io/part-of: horizon
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mozartpay
      app.kubernetes.io/component: horizon
      app.kubernetes.io/network: testnet
      app.kubernetes.io/part-of: horizon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mozartpay
        app.kubernetes.io/component: horizon
        app.kubernetes.io/network: testnet
        app.kubernetes.io/part-of: horizon
    spec:
      serviceAccountName: mozartpay-sa
      initContainers:
      - name: init-db
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U mozartpay; do
            echo "Waiting for postgres..."
            sleep 2
          done
          PGPASSWORD=mozartpay123 psql -h postgres -p 5432 -U mozartpay -d mozartpay -c "CREATE DATABASE IF NOT EXISTS horizon_testnet;"
          PGPASSWORD=mozartpay123 psql -h postgres -p 5432 -U mozartpay -d mozartpay -c "CREATE DATABASE IF NOT EXISTS stellar_core_testnet;"
      containers:
      - name: horizon
        image: stellar/stellar-horizon:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: STELLAR_NETWORK_TESTNET
          value: "true"
        - name: DATABASE_URL
          value: "postgresql://mozartpay:mozartpay123@postgres:5432/horizon_testnet"
        - name: STELLAR_CORE_DATABASE_URL
          value: "postgresql://mozartpay:mozartpay123@postgres:5432/stellar_core_testnet"
        - name: LOG_LEVEL
          value: "info"
        - name: PER_HOUR_RATE_LIMIT
          value: "72000"
        volumeMounts:
        - name: horizon-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "600m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: horizon-data
        persistentVolumeClaim:
          claimName: horizon-testnet-pvc
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-testnet
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: horizon
    app.kubernetes.io/network: testnet
    app.kubernetes.io/part-of: horizon
spec:
  selector:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: horizon
    app.kubernetes.io/network: testnet
    app.kubernetes.io/part-of: horizon
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: horizon-testnet-hpa
  namespace: mozartpay
  labels:
    app.kubernetes.io/name: mozartpay
    app.kubernetes.io/component: horizon
    app.kubernetes.io/network: testnet
    app.kubernetes.io/part-of: horizon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: horizon-testnet
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
